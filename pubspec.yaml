name: magambell
description: "A new Flutter project."
publish_to: 'none' 

version: 1.0.0+1

environment:
  sdk: ^3.9.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  cupertino_icons: ^1.0.8
  flutter_dotenv: ^5.2.1
  flutter_localization: ^0.3.3
  go_router: ^14.8.0
  freezed_annotation: ^2.4.1
  json_annotation: ^4.9.0
  intl: ^0.20.2
  cached_network_image: ^3.4.1
  flutter_svg: ^2.0.10+1

  # Network
  dio: ^5.7.0
  pretty_dio_logger: ^1.4.0

  # Logging
  talker_flutter: ^4.6.12
  talker_dio_logger: ^4.6.12
  talker_riverpod_logger: ^4.6.12

  # Firebase
  firebase_core: ^3.10.0
  firebase_messaging: ^15.2.3
  flutter_local_notifications: ^18.0.1

  # Device Info
  package_info_plus: ^8.1.2
  device_info_plus: ^11.2.0
  geolocator: ^10.1.0

  # State Management
  flutter_riverpod: ^2.6.1
  riverpod_annotation: ^2.6.1
  dartx: ^1.2.0
  flutter_screenutil: ^5.9.3

  shared_preferences: ^2.3.3
  shorebird_code_push: ^2.0.5
  restart_app: ^1.3.2
  card_swiper: ^3.0.1
  flutter_naver_map: ^1.4.1+1
  url_launcher: ^6.3.2
  flash: ^3.1.1
  reactive_forms: ^17.0.1
  flutter_naver_login: ^2.1.1
  kakao_flutter_sdk: ^1.9.7+3
  sign_in_with_apple: ^7.0.1
  kpostal: ^1.1.0  
  image_picker: ^1.2.0
  dotted_border: ^3.1.0
  lottie: ^3.3.2
  geocoding: ^3.0.0

  # PortOne Payment
  webview_flutter: ^4.10.0
  portone_flutter: ^0.12.1


dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^5.0.0
  freezed: ^2.3.7
  json_serializable: ^6.8.0
  riverpod_generator: ^2.6.2
  build_runner: ^2.4.13
  go_router_builder: 2.8.0
  change_app_package_name: ^1.5.0

flutter:

  uses-material-design: true

  assets:
    - .env
    - shorebird.yaml
    - assets/images/
    - assets/images/character/
    - assets/icons/
    - assets/icons/svg/
    - assets/icons/svg/filled/
    - assets/icons/svg/bank/
    - assets/lottie/
    - assets/logo/
    - shorebird.yaml

  fonts:
    - family: Pretendard
      fonts:
        - asset: assets/fonts/Pretendard-Thin.otf
          weight: 100
        - asset: assets/fonts/Pretendard-ExtraLight.otf
          weight: 200
        - asset: assets/fonts/Pretendard-Light.otf
          weight: 300
        - asset: assets/fonts/Pretendard-Regular.otf
          weight: 400
        - asset: assets/fonts/Pretendard-Medium.otf
          weight: 500
        - asset: assets/fonts/Pretendard-SemiBold.otf
          weight: 600
        - asset: assets/fonts/Pretendard-Bold.otf
          weight: 700
        - asset: assets/fonts/Pretendard-ExtraBold.otf
          weight: 800
        - asset: assets/fonts/Pretendard-Black.otf
          weight: 900
