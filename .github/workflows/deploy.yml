name: Build And Deploy

permissions:
  contents: write
  actions: read

on:
  push:
    tags:
      - 'v*'  # 모든 버전 태그 (v1.0.0, v1.0.0-dev, v1.0.0-prod, v1.0.0-dev-patch1, etc.)

env:
  INITIAL_BUILD_NUMBER: 1
  FLUTTER_VERSION: "3.35.5"

jobs:
  set_env:
    runs-on: ubuntu-latest
    outputs:
      VERSION: ${{ steps.set_env.outputs.VERSION }}
      BUILD_NUMBER: ${{ steps.set_env.outputs.BUILD_NUMBER }}
      IS_PATCH: ${{ steps.set_env.outputs.IS_PATCH }}
      PATCH_BUILD_NUMBER: ${{ steps.set_env.outputs.PATCH_BUILD_NUMBER }}
      FLAVOR: ${{ steps.set_env.outputs.FLAVOR }}
      PLATFORM: ${{ steps.set_env.outputs.PLATFORM }}
    steps:
      - uses: actions/checkout@v4

      - name: set env
        id: set_env
        run: |
          JSON_FILE="build_numbers.json"
          TAG_NAME="${GITHUB_REF:10}"

          # 플랫폼 추출 (android / ios / both)
          if [[ "$TAG_NAME" == *-android* ]]; then
            PLATFORM="android"
          elif [[ "$TAG_NAME" == *-ios* ]]; then
            PLATFORM="ios"
          else
            PLATFORM="both"
          fi
          echo "PLATFORM=$PLATFORM" >> $GITHUB_OUTPUT

          # Flavor 추출 (dev 또는 prod)
          if [[ "$TAG_NAME" == *-dev* ]]; then
            FLAVOR="dev"
          elif [[ "$TAG_NAME" == *-prod* ]]; then
            FLAVOR="prod"
          else
            # dev/prod가 없으면 둘 다 빌드 (나중에 조건에서 처리)
            FLAVOR="both"
          fi

          # 패치 태그인 경우 -patch 부분 제거
          VERSION=$(echo "$TAG_NAME" | sed -E 's/-patch[0-9]*$//')

          echo "VERSION=$VERSION" >> $GITHUB_OUTPUT
          echo "FLAVOR=$FLAVOR" >> $GITHUB_OUTPUT

          # 빌드 번호 계산
          BUILD_NUMBER=$((${{ github.run_number }} + $INITIAL_BUILD_NUMBER))
          echo "BUILD_NUMBER=$BUILD_NUMBER" >> $GITHUB_OUTPUT

          # 패치 여부 확인
          if [[ "${{ github.ref }}" == refs/tags/*-patch* ]] || [[ "$VERSION" == *-patch* ]]; then
            echo "IS_PATCH=true" >> $GITHUB_OUTPUT

            # JSON 파일에서 기존 빌드 번호 추출
            if [ -f "$JSON_FILE" ]; then
              BASE_VERSION=$(echo "$VERSION" | sed -E 's/-patch[0-9]*$//')
              PATCH_BUILD_NUMBER=$(jq -r --arg VERSION "$BASE_VERSION" '.[$VERSION] // empty' $JSON_FILE)
              if [ -n "$PATCH_BUILD_NUMBER" ] && [ "$PATCH_BUILD_NUMBER" != "null" ]; then
                echo "PATCH_BUILD_NUMBER=$PATCH_BUILD_NUMBER" >> $GITHUB_OUTPUT
              else
                echo "PATCH_BUILD_NUMBER=$BUILD_NUMBER" >> $GITHUB_OUTPUT
              fi
            else
              echo "PATCH_BUILD_NUMBER=$BUILD_NUMBER" >> $GITHUB_OUTPUT
            fi
          else
            echo "IS_PATCH=false" >> $GITHUB_OUTPUT

            # JSON 파일에 빌드 번호 저장
            if [ ! -f "$JSON_FILE" ]; then
              echo "{}" > "$JSON_FILE"
            fi
            echo "$(jq --arg VERSION "$VERSION" --argjson BUILD_NUMBER "$BUILD_NUMBER" '.[$VERSION] = $BUILD_NUMBER' $JSON_FILE)" > $JSON_FILE
          fi

          # 디버깅 정보 출력
          echo "Event: ${{ github.event_name }}"
          echo "Ref: ${{ github.ref }}"
          echo "Version: $VERSION"
          echo "Flavor: $FLAVOR"
          echo "Build Number: $BUILD_NUMBER"

          PATCH_CHECK="false"
          if [[ "${{ github.ref }}" == refs/tags/*-patch* ]] || [[ "$VERSION" == *-patch* ]]; then
            PATCH_CHECK="true"
          fi
          echo "Is Patch: $PATCH_CHECK"

      - name: Upload Build Number JSON Artifact
        if: steps.set_env.outputs.IS_PATCH == 'false'
        uses: actions/upload-artifact@v4
        with:
          name: build_numbers
          path: build_numbers.json

  android-dev:
    timeout-minutes: 60
    needs: set_env
    if: |
      (needs.set_env.outputs.FLAVOR == 'dev' || needs.set_env.outputs.FLAVOR == 'both')
      && (needs.set_env.outputs.PLATFORM == 'android' || needs.set_env.outputs.PLATFORM == 'both')
    env:
      VERSION: ${{ needs.set_env.outputs.VERSION }}
      BUILD_NUMBER: ${{ needs.set_env.outputs.BUILD_NUMBER }}
      IS_PATCH: ${{ needs.set_env.outputs.IS_PATCH }}
      PATCH_BUILD_NUMBER: ${{ needs.set_env.outputs.PATCH_BUILD_NUMBER }}
      FLAVOR: dev
      MODE: dev
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Free up system disk space
        run: |
          echo "=== Disk usage before cleanup ==="
          df -h

          # CodeQL 삭제 (보안 스캐닝 미사용시)
          sudo rm -rf /opt/hostedtoolcache/CodeQL || true

          # Haskell/GHC 삭제
          sudo rm -rf /usr/local/.ghcup || true
          sudo rm -rf /opt/ghc || true

          # .NET SDK 삭제
          sudo rm -rf /usr/share/dotnet || true

          # Docker 이미지/컨테이너 정리
          docker system prune -af || true

          # 불필요한 패키지 제거
          sudo apt-get remove -y '^ghc-8.*' || true
          sudo apt-get remove -y 'php.*' || true
          sudo apt-get autoremove -y || true
          sudo apt-get clean

          echo "=== Disk usage after cleanup ==="
          df -h

      - name: Decrypt secrets
        env:
          CERT_ENCRYPT_PASSPHRASE: ${{ secrets.CERT_ENCRYPT_PASSPHRASE }}
        run: |
          chmod +x .github/scripts/decrypt-secrets.sh
          .github/scripts/decrypt-secrets.sh

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: true
          working-directory: android

      - name: Install dependencies
        working-directory: android
        run: bundle install

      - name: 🐦 Setup Shorebird
        uses: shorebirdtech/setup-shorebird@v1

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - uses: actions/setup-java@v4
        with:
          java-version: "17.x"
          distribution: "zulu"
          cache: gradle

      - name: Deploy Android
        env:
          FLUTTER_VERSION: ${{ env.FLUTTER_VERSION }}
          VERSION_NUMBER: ${{ env.VERSION }}
          BUILD_NUMBER: ${{ env.BUILD_NUMBER }}
          PATCH_BUILD_NUMBER: ${{ env.PATCH_BUILD_NUMBER }}
          SHOREBIRD_TOKEN: ${{ secrets.SHOREBIRD_TOKEN }}
          MODE: ${{ env.FLAVOR }}
        working-directory: android
        run: |
          # Create logs directory
          mkdir -p ../logs
          timestamp=$(date +"%Y%m%d_%H%M%S")

          # Check SHOREBIRD_TOKEN
          if [ -z "$SHOREBIRD_TOKEN" ]; then
            echo "ERROR: SHOREBIRD_TOKEN is not set"
            exit 1
          fi

          # Execute fastlane based on patch status
          if [[ "$IS_PATCH" == "true" ]]; then
            echo "Starting Android $FLAVOR patch at $timestamp"
            bundle exec fastlane patch --verbose 2>&1 | tee ../logs/fastlane_patch_${timestamp}.txt
            echo "Android patch completed at $(date)"
          else
            echo "Starting Android $FLAVOR release at $timestamp"
            bundle exec fastlane release --verbose 2>&1 | tee ../logs/fastlane_release_${timestamp}.txt
            echo "Android release completed at $(date)"
          fi

      - name: Distribute to Firebase App Distribution
        if: needs.set_env.outputs.IS_PATCH == 'false'
        env:
          MODE: dev
          FIREBASE_APP_ID_ANDROID_DEV: ${{ secrets.FIREBASE_APP_ID_ANDROID_DEV }}
          FIREBASE_APP_ID_ANDROID: ${{ secrets.FIREBASE_APP_ID_ANDROID }}
          GOOGLE_APPLICATION_CREDENTIALS_CONTENT: ${{ secrets.GOOGLE_APPLICATION_CREDENTIALS }}
        working-directory: android
        run: |
          # Setup Google Application Credentials
          echo "$GOOGLE_APPLICATION_CREDENTIALS_CONTENT" > google-services-key.json
          export GOOGLE_APPLICATION_CREDENTIALS="$PWD/google-services-key.json"

          # Check required environment variables
          if [ -z "$FIREBASE_APP_ID_ANDROID_DEV" ]; then
            echo "❌ ERROR: FIREBASE_APP_ID_ANDROID_DEV is not set"
            echo "Firebase App Distribution 배포를 위해 FIREBASE_APP_ID_ANDROID_DEV 시크릿이 필요합니다."
            exit 1
          fi

          if [ -z "$GOOGLE_APPLICATION_CREDENTIALS_CONTENT" ]; then
            echo "❌ ERROR: GOOGLE_APPLICATION_CREDENTIALS is not set"
            echo "Firebase App Distribution 배포를 위해 GOOGLE_APPLICATION_CREDENTIALS 시크릿이 필요합니다."
            exit 1
          fi

          # Check if APK exists
          if [ -f "../build/app/outputs/flutter-apk/app-${{ env.FLAVOR }}-release.apk" ]; then
            echo "✅ APK found at flutter-apk path"
          elif [ -f "../build/app/outputs/apk/${{ env.FLAVOR }}/release/app-${{ env.FLAVOR }}-release.apk" ]; then
            echo "✅ APK found at apk/release path, copying to flutter-apk path"
            mkdir -p "../build/app/outputs/flutter-apk"
            cp "../build/app/outputs/apk/${{ env.FLAVOR }}/release/app-${{ env.FLAVOR }}-release.apk" "../build/app/outputs/flutter-apk/app-${{ env.FLAVOR }}-release.apk"
          else
            echo "❌ APK file not found in expected locations"
            echo "Checked paths:"
            echo "  - ../build/app/outputs/flutter-apk/app-${{ env.FLAVOR }}-release.apk"
            echo "  - ../build/app/outputs/apk/${{ env.FLAVOR }}/release/app-${{ env.FLAVOR }}-release.apk"
            ls -la ../build/app/outputs/ || echo "outputs directory not found"
            echo "Shorebird release 빌드가 실패했거나 APK가 생성되지 않았습니다."
            exit 1
          fi

          echo "🚀 Starting Firebase App Distribution"

          # Firebase App Distribution 실행 및 결과 확인
          if bundle exec fastlane distribute --verbose 2>&1 | tee ../logs/fastlane_distribute_$(date +"%Y%m%d_%H%M%S").txt; then
            echo "✅ Firebase App Distribution completed successfully at $(date)"
          else
            echo "❌ Firebase App Distribution failed at $(date)"
            echo "배포 실패로 인해 android-build job을 실패 처리합니다."
            exit 1
          fi

      - name: Generate log summary
        if: always()
        run: |
          cd logs
          if [ -f fastlane_*.txt ]; then
            latest_log=$(ls -t fastlane_*.txt | head -1)
            echo "# Android Fastlane Log Summary" > log_summary.md
            echo "Generated at: $(date)" >> log_summary.md
            echo "Action: ${{ env.IS_PATCH == 'true' && 'patch' || 'release' }}" >> log_summary.md
            echo "Version: ${{ env.VERSION }}" >> log_summary.md
            echo "Flavor: ${{ env.FLAVOR }}" >> log_summary.md
            echo "" >> log_summary.md
            echo "## Log File: $latest_log" >> log_summary.md
            echo "" >> log_summary.md

            # Extract errors, warnings, and success messages
            for level in error warning success; do
              if grep -i "$level" "$latest_log" > /dev/null; then
                echo "## ${level^} Messages:" >> log_summary.md
                grep -i "$level" "$latest_log" | head -10 >> log_summary.md
                echo "" >> log_summary.md
              fi
            done
          fi

      - name: Upload log files
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-dev-logs-${{ github.run_number }}
          path: |
            logs/*.txt
            logs/*.md

  android-prod:
    timeout-minutes: 60
    needs: set_env
    if: |
      (needs.set_env.outputs.FLAVOR == 'prod' || needs.set_env.outputs.FLAVOR == 'both')
      && (needs.set_env.outputs.PLATFORM == 'android' || needs.set_env.outputs.PLATFORM == 'both')
    env:
      VERSION: ${{ needs.set_env.outputs.VERSION }}
      BUILD_NUMBER: ${{ needs.set_env.outputs.BUILD_NUMBER }}
      IS_PATCH: ${{ needs.set_env.outputs.IS_PATCH }}
      PATCH_BUILD_NUMBER: ${{ needs.set_env.outputs.PATCH_BUILD_NUMBER }}
      FLAVOR: prod
      MODE: prod
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Free up system disk space
        run: |
          echo "=== Disk usage before cleanup ==="
          df -h

          # CodeQL 삭제 (보안 스캐닝 미사용시)
          sudo rm -rf /opt/hostedtoolcache/CodeQL || true

          # Haskell/GHC 삭제
          sudo rm -rf /usr/local/.ghcup || true
          sudo rm -rf /opt/ghc || true

          # .NET SDK 삭제
          sudo rm -rf /usr/share/dotnet || true

          # Docker 이미지/컨테이너 정리
          docker system prune -af || true

          # 불필요한 패키지 제거
          sudo apt-get remove -y '^ghc-8.*' || true
          sudo apt-get remove -y 'php.*' || true
          sudo apt-get autoremove -y || true
          sudo apt-get clean

          echo "=== Disk usage after cleanup ==="
          df -h

      - name: Decrypt secrets
        env:
          CERT_ENCRYPT_PASSPHRASE: ${{ secrets.CERT_ENCRYPT_PASSPHRASE }}
        run: |
          chmod +x .github/scripts/decrypt-secrets.sh
          .github/scripts/decrypt-secrets.sh

      # Keystore 복원
      - name: Decode keystore
        run: |
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > android/app/magambell-release.keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}

      # key.properties 생성
      - name: Create key.properties
        run: |
          cat <<EOF > android/key.properties
          storePassword=${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          keyPassword=${{ secrets.ANDROID_KEY_PASSWORD }}
          keyAlias=${{ secrets.ANDROID_KEY_ALIAS }}
          storeFile=magambell-release.keystore
          EOF

      # 서명 파일 확인
      - name: Check signing files
        run: |
          echo "Current directory:"
          pwd
          echo "List android/app:"
          ls -la android/app | grep -E 'keystore|total'
          echo "Check key.properties:"
          cat android/key.properties

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: true
          working-directory: android

      - name: Install dependencies
        working-directory: android
        run: bundle install

      - name: 🐦 Setup Shorebird
        uses: shorebirdtech/setup-shorebird@v1

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - uses: actions/setup-java@v4
        with:
          java-version: "17.x"
          distribution: "zulu"
          cache: gradle

      - name: Deploy Android
        env:
          FLUTTER_VERSION: ${{ env.FLUTTER_VERSION }}
          VERSION_NUMBER: ${{ env.VERSION }}
          BUILD_NUMBER: ${{ env.BUILD_NUMBER }}
          PATCH_BUILD_NUMBER: ${{ env.PATCH_BUILD_NUMBER }}
          SHOREBIRD_TOKEN: ${{ secrets.SHOREBIRD_TOKEN }}
          MODE: ${{ env.FLAVOR }}
        working-directory: android
        run: |
          # Create logs directory
          mkdir -p ../logs
          timestamp=$(date +"%Y%m%d_%H%M%S")

          # Check SHOREBIRD_TOKEN
          if [ -z "$SHOREBIRD_TOKEN" ]; then
            echo "ERROR: SHOREBIRD_TOKEN is not set"
            exit 1
          fi

          # Execute fastlane based on patch status
          if [[ "$IS_PATCH" == "true" ]]; then
            echo "Starting Android $FLAVOR patch at $timestamp"
            bundle exec fastlane patch --verbose 2>&1 | tee ../logs/fastlane_patch_${timestamp}.txt
            echo "Android patch completed at $(date)"
          else
            echo "Starting Android $FLAVOR release at $timestamp"
            bundle exec fastlane release --verbose 2>&1 | tee ../logs/fastlane_release_${timestamp}.txt
            echo "Android release completed at $(date)"
          fi

      # Play Store 서비스 계정 JSON 생성
      - name: Create google-play service account JSON
        if: needs.set_env.outputs.IS_PATCH == 'false'
        run: |
          echo "$PLAY_JSON" > android/fastlane/google-play-service-account.json
          echo "✅ JSON 파일 생성됨"
          ls -lh android/fastlane/google-play-service-account.json
          echo "📄 JSON 파일 첫 줄 확인:"
          head -n 1 android/fastlane/google-play-service-account.json
        env:
          PLAY_JSON: ${{ secrets.PLAY_STORE_SERVICE_ACCOUNT_JSON }}

      # AAB 빌드 및 Play Store 업로드
      - name: Build AAB and Upload to Play Store
        if: needs.set_env.outputs.IS_PATCH == 'false'
        working-directory: android
        run: bundle exec fastlane internal
        env:
          MODE: prod
          PACKAGE_NAME: com.trendflow.bread
          VERSION: ${{ env.VERSION }}
          BUILD_NUMBER: ${{ env.BUILD_NUMBER }}

      - name: Generate log summary
        if: always()
        run: |
          cd logs
          if [ -f fastlane_*.txt ]; then
            latest_log=$(ls -t fastlane_*.txt | head -1)
            echo "# Android Fastlane Log Summary" > log_summary.md
            echo "Generated at: $(date)" >> log_summary.md
            echo "Action: ${{ env.IS_PATCH == 'true' && 'patch' || 'release' }}" >> log_summary.md
            echo "Version: ${{ env.VERSION }}" >> log_summary.md
            echo "Flavor: ${{ env.FLAVOR }}" >> log_summary.md
            echo "" >> log_summary.md
            echo "## Log File: $latest_log" >> log_summary.md
            echo "" >> log_summary.md

            # Extract errors, warnings, and success messages
            for level in error warning success; do
              if grep -i "$level" "$latest_log" > /dev/null; then
                echo "## ${level^} Messages:" >> log_summary.md
                grep -i "$level" "$latest_log" | head -10 >> log_summary.md
                echo "" >> log_summary.md
              fi
            done
          fi

      - name: Upload log files
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-logs-${{ github.run_number }}
          path: |
            logs/*.txt
            logs/*.md
          retention-days: 30

  ios-dev:
    timeout-minutes: 60
    needs: set_env
    if: |
      (needs.set_env.outputs.FLAVOR == 'dev' || needs.set_env.outputs.FLAVOR == 'both')
      && (needs.set_env.outputs.PLATFORM == 'ios' || needs.set_env.outputs.PLATFORM == 'both')
    env:
      VERSION: ${{ needs.set_env.outputs.VERSION }}
      BUILD_NUMBER: ${{ needs.set_env.outputs.BUILD_NUMBER }}
      IS_PATCH: ${{ needs.set_env.outputs.IS_PATCH }}
      PATCH_BUILD_NUMBER: ${{ needs.set_env.outputs.PATCH_BUILD_NUMBER }}
      FLAVOR: dev
      MODE: dev
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Decrypt secrets
        env:
          CERT_ENCRYPT_PASSPHRASE: ${{ secrets.CERT_ENCRYPT_PASSPHRASE }}
        run: |
          chmod +x .github/scripts/decrypt-secrets.sh
          .github/scripts/decrypt-secrets.sh

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: true
          working-directory: ios

      - name: Install dependencies
        working-directory: ios
        run: bundle install

      - name: Update CocoaPods
        run: |
          sudo gem install cocoapods -v 1.16.2
          pod --version

      - name: 🐦 Setup Shorebird
        uses: shorebirdtech/setup-shorebird@v1

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Fix Xcode version for iOS SDK
        run: sudo xcode-select --switch /Applications/Xcode_16.4.app

      - name: Deploy iOS
        env:
          FLUTTER_VERSION: ${{ env.FLUTTER_VERSION }}
          VERSION_NUMBER: ${{ env.VERSION }}
          BUILD_NUMBER: ${{ env.BUILD_NUMBER }}
          PATCH_BUILD_NUMBER: ${{ env.PATCH_BUILD_NUMBER }}
          SHOREBIRD_TOKEN: ${{ secrets.SHOREBIRD_TOKEN }}
          MODE: ${{ env.FLAVOR }}
          APP_STORE_CONNECT_API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          APP_STORE_CONNECT_API_KEY_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ISSUER_ID }}
          MATCH_PASSWORD: ${{ secrets.MATCH_PASSWORD }}
          MATCH_GIT_BASIC_AUTHORIZATION: ${{ secrets.MATCH_GIT_BASIC_AUTHORIZATION }}
        working-directory: ios
        run: |
          # Export options plist with absolute path
          export EXPORT_OPTIONS_PLIST="$(pwd)/export_options.plist"

          # Create logs directory
          mkdir -p ../logs
          timestamp=$(date +"%Y%m%d_%H%M%S")

          # Check SHOREBIRD_TOKEN
          if [ -z "$SHOREBIRD_TOKEN" ]; then
            echo "ERROR: SHOREBIRD_TOKEN is not set"
            exit 1
          fi

          # Check App Store Connect API credentials
          if [ -z "$APP_STORE_CONNECT_API_KEY_ID" ] || [ -z "$APP_STORE_CONNECT_API_KEY_ISSUER_ID" ]; then
            echo "ERROR: App Store Connect API credentials are not set"
            exit 1
          fi

          # Check if AuthKey.p8 was decrypted
          if [ ! -f "AuthKey.p8" ]; then
            echo "ERROR: AuthKey.p8 file not found. GPG decryption may have failed."
            exit 1
          fi

          # Check Match credentials
          if [ -z "$MATCH_PASSWORD" ] || [ -z "$MATCH_GIT_BASIC_AUTHORIZATION" ]; then
            echo "ERROR: Match credentials are not set"
            exit 1
          fi

          # Execute fastlane based on patch status
          if [[ "$IS_PATCH" == "true" ]]; then
            echo "Starting iOS $FLAVOR patch at $timestamp"
            bundle exec fastlane patch --verbose 2>&1 | tee ../logs/fastlane_ios_patch_${timestamp}.txt
            echo "iOS patch completed at $(date)"
          else
            echo "Starting iOS $FLAVOR release at $timestamp"
            bundle exec fastlane release --verbose 2>&1 | tee ../logs/fastlane_ios_release_${timestamp}.txt
            echo "iOS release completed at $(date)"
          fi

      - name: Distribute to Firebase App Distribution
        if: needs.set_env.outputs.IS_PATCH == 'false'
        env:
          MODE: dev
          FIREBASE_APP_ID_IOS_DEV: ${{ secrets.FIREBASE_APP_ID_IOS_DEV }}
          FIREBASE_APP_ID_IOS: ${{ secrets.FIREBASE_APP_ID_IOS }}
          GOOGLE_APPLICATION_CREDENTIALS_CONTENT: ${{ secrets.GOOGLE_APPLICATION_CREDENTIALS }}
        working-directory: ios
        run: |
          # Setup Google Application Credentials
          echo "$GOOGLE_APPLICATION_CREDENTIALS_CONTENT" > google-services-key.json
          export GOOGLE_APPLICATION_CREDENTIALS="$PWD/google-services-key.json"

          # Check required environment variables
          if [ -z "$FIREBASE_APP_ID_IOS_DEV" ]; then
            echo "❌ ERROR: FIREBASE_APP_ID_IOS_DEV is not set"
            echo "Firebase App Distribution 배포를 위해 FIREBASE_APP_ID_IOS_DEV 시크릿이 필요합니다."
            exit 1
          fi

          if [ -z "$GOOGLE_APPLICATION_CREDENTIALS_CONTENT" ]; then
            echo "❌ ERROR: GOOGLE_APPLICATION_CREDENTIALS is not set"
            echo "Firebase App Distribution 배포를 위해 GOOGLE_APPLICATION_CREDENTIALS 시크릿이 필요합니다."
            exit 1
          fi

          # Check if IPA exists - use find command to locate any .ipa file
          echo "🔍 Searching for IPA files..."
          ls -la ../build/ios/ || echo "ios build directory not found"
          ls -la ../build/ios/ipa/ || echo "ipa directory not found"

          # Find any .ipa file in the directory
          IPA_FILE=$(find ../build/ios/ipa -name "*.ipa" -type f | head -1)

          if [ -n "$IPA_FILE" ]; then
            echo "✅ IPA found at: $IPA_FILE"
            # Create symbolic link with expected name if needed
            if [ ! -f "../build/ios/ipa/magambell.ipa" ]; then
              echo "Creating symbolic link to magambell.ipa"
              ln -s "$(basename "$IPA_FILE")" "../build/ios/ipa/magambell.ipa"
            fi
          else
            echo "❌ No IPA file found in ../build/ios/ipa/"
            echo "Directory contents:"
            find ../build/ios/ipa -type f || echo "No files found"
            echo "Shorebird release 빌드가 실패했거나 IPA가 생성되지 않았습니다."
            exit 1
          fi

          echo "🚀 Starting Firebase App Distribution for iOS"

          # Firebase App Distribution 실행 및 결과 확인
          if bundle exec fastlane distribute --verbose 2>&1 | tee ../logs/fastlane_ios_distribute_$(date +"%Y%m%d_%H%M%S").txt; then
            echo "✅ Firebase App Distribution completed successfully at $(date)"
          else
            echo "❌ Firebase App Distribution failed at $(date)"
            echo "배포 실패로 인해 ios-build job을 실패 처리합니다."
            exit 1
          fi

      - name: Generate log summary
        if: always()
        run: |
          cd logs
          if [ -f fastlane_ios_*.txt ]; then
            latest_log=$(ls -t fastlane_ios_*.txt | head -1)
            echo "# iOS Fastlane Log Summary" > log_summary_ios.md
            echo "Generated at: $(date)" >> log_summary_ios.md
            echo "Action: ${{ env.IS_PATCH == 'true' && 'patch' || 'release' }}" >> log_summary_ios.md
            echo "Version: ${{ env.VERSION }}" >> log_summary_ios.md
            echo "Flavor: ${{ env.FLAVOR }}" >> log_summary_ios.md
            echo "" >> log_summary_ios.md
            echo "## Log File: $latest_log" >> log_summary_ios.md
            echo "" >> log_summary_ios.md

            # Extract errors, warnings, and success messages
            for level in error warning success; do
              if grep -i "$level" "$latest_log" > /dev/null; then
                echo "## ${level^} Messages:" >> log_summary_ios.md
                grep -i "$level" "$latest_log" | head -10 >> log_summary_ios.md
                echo "" >> log_summary_ios.md
              fi
            done
          fi

      - name: Upload log files
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-dev-logs-${{ github.run_number }}
          path: |
            logs/*.txt
            logs/*.md
          retention-days: 30

  push_changes:
    needs: [set_env, android-dev, android-prod, ios-dev, ios-prod]
    if: |
      always() &&
      needs.set_env.result == 'success' &&
      needs.set_env.outputs.IS_PATCH == 'false' &&
      (needs.android-dev.result == 'success' || needs.android-dev.result == 'skipped') &&
      (needs.android-prod.result == 'success' || needs.android-prod.result == 'skipped') &&
      (needs.ios-dev.result == 'success' || needs.ios-dev.result == 'skipped') &&
      (needs.ios-prod.result == 'success' || needs.ios-prod.result == 'skipped')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Download Build Number JSON Artifact
        uses: actions/download-artifact@v4
        with:
          name: build_numbers
          path: .

      - name: Commit and Push Changes
        run: |
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"

          if [ -f "build_numbers.json" ]; then
            git add build_numbers.json
            if git diff --staged --quiet; then
              echo "No changes to commit"
            else
              git commit -m "Update build number for version ${{ needs.set_env.outputs.VERSION }} [skip ci]"
              git push origin main
            fi
          else
            echo "build_numbers.json not found, skipping commit"
          fi
  ios-prod:
    timeout-minutes: 60
    needs: set_env
    if: |
      (needs.set_env.outputs.FLAVOR == 'prod' || needs.set_env.outputs.FLAVOR == 'both')
      && (needs.set_env.outputs.PLATFORM == 'ios' || needs.set_env.outputs.PLATFORM == 'both')
    env:
      VERSION: ${{ needs.set_env.outputs.VERSION }}
      BUILD_NUMBER: ${{ needs.set_env.outputs.BUILD_NUMBER }}
      IS_PATCH: ${{ needs.set_env.outputs.IS_PATCH }}
      PATCH_BUILD_NUMBER: ${{ needs.set_env.outputs.PATCH_BUILD_NUMBER }}
      FLAVOR: prod
      MODE: prod
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Decrypt secrets
        env:
          CERT_ENCRYPT_PASSPHRASE: ${{ secrets.CERT_ENCRYPT_PASSPHRASE }}
        run: |
          chmod +x .github/scripts/decrypt-secrets.sh
          .github/scripts/decrypt-secrets.sh

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: true
          working-directory: ios

      - name: Install dependencies
        working-directory: ios
        run: bundle install

      - name: Update CocoaPods
        run: |
          sudo gem install cocoapods -v 1.16.2
          pod --version

      - name: 🐦 Setup Shorebird
        uses: shorebirdtech/setup-shorebird@v1

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Fix Xcode version for iOS SDK
        run: sudo xcode-select --switch /Applications/Xcode_16.4.app

      - name: Deploy iOS
        env:
          FLUTTER_VERSION: ${{ env.FLUTTER_VERSION }}
          VERSION_NUMBER: ${{ env.VERSION }}
          BUILD_NUMBER: ${{ env.BUILD_NUMBER }}
          PATCH_BUILD_NUMBER: ${{ env.PATCH_BUILD_NUMBER }}
          SHOREBIRD_TOKEN: ${{ secrets.SHOREBIRD_TOKEN }}
          MODE: ${{ env.FLAVOR }}
          APP_STORE_CONNECT_API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          APP_STORE_CONNECT_API_KEY_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ISSUER_ID }}
          MATCH_PASSWORD: ${{ secrets.MATCH_PASSWORD }}
          MATCH_GIT_BASIC_AUTHORIZATION: ${{ secrets.MATCH_GIT_BASIC_AUTHORIZATION }}
        working-directory: ios
        run: |
          # Export options plist with absolute path
          export EXPORT_OPTIONS_PLIST="$(pwd)/export_options.plist"

          # Create logs directory
          mkdir -p ../logs
          timestamp=$(date +"%Y%m%d_%H%M%S")

          # Check SHOREBIRD_TOKEN
          if [ -z "$SHOREBIRD_TOKEN" ]; then
            echo "ERROR: SHOREBIRD_TOKEN is not set"
            exit 1
          fi

          # Check App Store Connect API credentials
          if [ -z "$APP_STORE_CONNECT_API_KEY_ID" ] || [ -z "$APP_STORE_CONNECT_API_KEY_ISSUER_ID" ]; then
            echo "ERROR: App Store Connect API credentials are not set"
            exit 1
          fi

          # Check if AuthKey.p8 was decrypted
          if [ ! -f "AuthKey.p8" ]; then
            echo "ERROR: AuthKey.p8 file not found. GPG decryption may have failed."
            exit 1
          fi

          # Check Match credentials
          if [ -z "$MATCH_PASSWORD" ] || [ -z "$MATCH_GIT_BASIC_AUTHORIZATION" ]; then
            echo "ERROR: Match credentials are not set"
            exit 1
          fi

          # Execute fastlane based on patch status
          if [[ "$IS_PATCH" == "true" ]]; then
            echo "Starting iOS $FLAVOR patch at $timestamp"
            bundle exec fastlane patch --verbose 2>&1 | tee ../logs/fastlane_ios_patch_${timestamp}.txt
            echo "iOS patch completed at $(date)"
          else
            echo "Starting iOS $FLAVOR release at $timestamp"
            bundle exec fastlane release --verbose 2>&1 | tee ../logs/fastlane_ios_release_${timestamp}.txt
            echo "iOS release completed at $(date)"
          fi

      - name: Distribute to Firebase App Distribution
        if: needs.set_env.outputs.IS_PATCH == 'false'
        env:
          MODE: prod
          FIREBASE_APP_ID_IOS_DEV: ${{ secrets.FIREBASE_APP_ID_IOS_DEV }}
          FIREBASE_APP_ID_IOS: ${{ secrets.FIREBASE_APP_ID_IOS }}
          GOOGLE_APPLICATION_CREDENTIALS_CONTENT: ${{ secrets.GOOGLE_APPLICATION_CREDENTIALS }}
        working-directory: ios
        run: |
          # Setup Google Application Credentials
          echo "$GOOGLE_APPLICATION_CREDENTIALS_CONTENT" > google-services-key.json
          export GOOGLE_APPLICATION_CREDENTIALS="$PWD/google-services-key.json"

          # Check required environment variables
          if [ -z "$FIREBASE_APP_ID_IOS" ]; then
            echo "❌ ERROR: FIREBASE_APP_ID_IOS is not set"
            echo "Firebase App Distribution 배포를 위해 FIREBASE_APP_ID_IOS 시크릿이 필요합니다."
            exit 1
          fi

          if [ -z "$GOOGLE_APPLICATION_CREDENTIALS_CONTENT" ]; then
            echo "❌ ERROR: GOOGLE_APPLICATION_CREDENTIALS is not set"
            echo "Firebase App Distribution 배포를 위해 GOOGLE_APPLICATION_CREDENTIALS 시크릿이 필요합니다."
            exit 1
          fi

          # Check if IPA exists - use find command to locate any .ipa file
          echo "🔍 Searching for IPA files..."
          ls -la ../build/ios/ || echo "ios build directory not found"
          ls -la ../build/ios/ipa/ || echo "ipa directory not found"

          # Find any .ipa file in the directory
          IPA_FILE=$(find ../build/ios/ipa -name "*.ipa" -type f | head -1)

          if [ -n "$IPA_FILE" ]; then
            echo "✅ IPA found at: $IPA_FILE"
            # Create symbolic link with expected name if needed
            if [ ! -f "../build/ios/ipa/magambell.ipa" ]; then
              echo "Creating symbolic link to magambell.ipa"
              ln -s "$(basename "$IPA_FILE")" "../build/ios/ipa/magambell.ipa"
            fi
          else
            echo "❌ No IPA file found in ../build/ios/ipa/"
            echo "Directory contents:"
            find ../build/ios/ipa -type f || echo "No files found"
            echo "Shorebird release 빌드가 실패했거나 IPA가 생성되지 않았습니다."
            exit 1
          fi

          echo "🚀 Starting Firebase App Distribution for iOS"

          # Firebase App Distribution 실행 및 결과 확인
          if bundle exec fastlane distribute --verbose 2>&1 | tee ../logs/fastlane_ios_distribute_$(date +"%Y%m%d_%H%M%S").txt; then
            echo "✅ Firebase App Distribution completed successfully at $(date)"
          else
            echo "❌ Firebase App Distribution failed at $(date)"
            echo "배포 실패로 인해 ios-build job을 실패 처리합니다."
            exit 1
          fi

      - name: Generate log summary
        if: always()
        run: |
          cd logs
          if [ -f fastlane_ios_*.txt ]; then
            latest_log=$(ls -t fastlane_ios_*.txt | head -1)
            echo "# iOS Fastlane Log Summary" > log_summary_ios.md
            echo "Generated at: $(date)" >> log_summary_ios.md
            echo "Action: ${{ env.IS_PATCH == 'true' && 'patch' || 'release' }}" >> log_summary_ios.md
            echo "Version: ${{ env.VERSION }}" >> log_summary_ios.md
            echo "Flavor: ${{ env.FLAVOR }}" >> log_summary_ios.md
            echo "" >> log_summary_ios.md
            echo "## Log File: $latest_log" >> log_summary_ios.md
            echo "" >> log_summary_ios.md

            # Extract errors, warnings, and success messages
            for level in error warning success; do
              if grep -i "$level" "$latest_log" > /dev/null; then
                echo "## ${level^} Messages:" >> log_summary_ios.md
                grep -i "$level" "$latest_log" | head -10 >> log_summary_ios.md
                echo "" >> log_summary_ios.md
              fi
            done
          fi

      - name: Upload log files
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-logs-${{ github.run_number }}
          path: |
            logs/*.txt
            logs/*.md
          retention-days: 30

